name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path examples/hello/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path examples/hello/Cargo.toml --target wasm32-wasip2 --all-features -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/e2e.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 exsample/scripts/setup.py
      - run: python3 exsample/scripts/build.py
      - run: python3 exsample/scripts/test_unit.py
      - run: npx playwright install --with-deps chromium
        working-directory: exsample/typescript
      - run: python3 exsample/scripts/test_http.py
