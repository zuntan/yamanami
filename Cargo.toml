[package]
name = "yamanami"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["zuntan"]
description = "A small experimental WebAssembly application server"
repository = "https://github.com/zuntan/yamanami"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs"] }
wasmtime = { version = "=48.0.7", default-features = false, features = ["anyhow", "async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.7", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "=48.0.7", default-features = false, features = ["p2"] }

[dev-dependencies]
tempfile = "3"

[workspace]
exclude = ["examples/hello"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
