<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{language}} Calculator — Yamanami</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font:16px/1.5 system-ui,sans-serif;color:#18243a;background:#f5f7fb}
main{max-width:460px;margin:auto}h1{font-size:25px;margin:0 0 4px}.tag{color:#58657b;font-size:13px}
form{display:grid;gap:12px;margin-top:22px}label{display:grid;gap:4px;font-size:13px}
input,select,button{font:inherit;border:1px solid #c9d2e2;border-radius:9px;padding:10px;background:white;width:100%}
.actions{display:flex;gap:10px;align-items:center}button{background:#254ad4;color:white;border:0;cursor:pointer}.clear{color:#254ad4;white-space:nowrap}
output{display:block;font-size:28px;min-height:52px;overflow-wrap:anywhere;padding:8px 0}.error{color:#b42318;min-height:24px}
footer{border-top:1px solid #dce2ee;padding-top:12px;margin-top:14px;color:#58657b;font-size:12px}
</style></head><body><main data-language="{{language}}" data-version="{{version}}">
<h1>{{language}} Calculator</h1><div class="tag">4 Languages, 4 Applications, 1 Yamanami.</div>
<form method="post" action="{{path}}/">
<label>左の数値<input name="a" value="{{a}}" inputmode="decimal" maxlength="100" required></label>
<label>演算<select name="op"><option value="add">＋ 加算</option><option value="sub">− 減算</option><option value="mul">× 乗算</option><option value="div">÷ 除算</option></select></label>
<label>右の数値<input name="b" value="{{b}}" inputmode="decimal" maxlength="100" required></label>
<div class="actions"><button type="submit">計算する</button><a class="clear" href="{{path}}/">クリア</a></div>
</form><div class="tag">結果 · {{operation}}</div><output id="result">{{result}}</output><div class="error" role="status">{{error}}</div>
<footer>Template: {{template}}<br>Runtime: {{runtime}}<br>WASI HTTP 0.2 · {{version}} · 計算はサーバー側Wasmで実行</footer>
</main></body></html>
